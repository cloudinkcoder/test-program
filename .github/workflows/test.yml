name: Test difference platforms

on:
  workflow_dispatch:

jobs:
  test:
    # 动态命名任务，方便在 PR 检查面板中区分架构
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      # 建议设为 false，防止一个架构失败导致另一个架构的测试被强制取消
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
          - arch: arm64
            runner: macos-latest

    steps:
      - name: Verify Architecture
        run: |
          echo "Current Architecture: $(uname -m)"
          echo "Matrix Target: ${{ matrix.arch }}"
