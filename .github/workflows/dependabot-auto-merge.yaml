name: Dependabot Auto Merge

on: pull_request

jobs:
  call-auto-merge:
    uses: ac2learn/tools/.github/workflows/reusable-auto-merge-dependabot-prs.yml@main
    with:
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_author: ${{ github.event.pull_request.user.login }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
